" stroke="#1d5f93" stroke-width="3" marker-end="url(#fa)" /><path d="M562.9,88.3 L602.1,92.5" fill="none" stroke="#1d5f93" stroke-width="3" marker-end="url(#fa)" /></g><clipPath id="cl"><rect x="10" y="10" width="700" height="330" rx="10"/></clipPath><text x="200" y="368" text-anchor="middle" class="p"><tspan class="l">Borrasca</tspan>: baja en el centro</text><text x="200" y="387" text-anchor="middle" class="p">viento contrario a las agujas</text><text x="200" y="406" text-anchor="middle" class="p">del reloj y hacia dentro</text><text x="200" y="425" text-anchor="middle" class="p">nubes, lluvia y viento</text><text x="525" y="368" text-anchor="middle" class="p"><tspan class="l">Anticiclón</tspan>: alta en el centro</text><text x="525" y="387" text-anchor="middle" class="p">viento como las agujas</text><text x="525" y="406" text-anchor="middle" class="p">del reloj y hacia fuera</text><text x="525" y="425" text-anchor="middle" class="p">tiempo estable</text><text x="360" y="464" text-anchor="middle" class="p">Hemisferio norte. Isobaras (igual presión) cada 4 hPa: cuanto más juntas, más viento.</text>
