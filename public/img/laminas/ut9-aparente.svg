<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t">
<title id="t">Viento real, relativo y aparente como suma de vectores</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#14202b}
.b{font-weight:700}.p{font-size:15px;fill:#4b5b69}.l{font-size:15px;font-weight:600;fill:#14202b}.s{font-size:14px;fill:#4b5b69}
.h{fill:#eef2f5;stroke:#14202b;stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
</style>
<defs><marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker>
<marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1d5f93"/></marker>
<marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5c6b78"/></marker>
<path id="bq" d="M0,-30 C9,-21 11,-9 11,0 L9,24 L-9,24 L-11,0 C-11,-9 -9,-21 0,-30 Z"/></defs>
<rect width="720" height="380" rx="14" fill="#fff"/>
<g transform="translate(120 230) rotate(0) scale(1.8)"><use href="#bq" class="h"/></g><path d="M120,160 L120,110" fill="none" stroke="#5c6b78" stroke-width="3" marker-end="url(#fg)" /><text x="120" y="98" text-anchor="middle" class="s">rumbo</text><path d="M470,90 L310,90" fill="none" stroke="#1d5f93" stroke-width="4" marker-end="url(#fa)" /><path d="M310,90 L310,210" fill="none" stroke="#5c6b78" stroke-width="4" marker-end="url(#fg)" /><path d="M470,90 L314,206" fill="none" stroke="#c2410c" stroke-width="4" marker-end="url(#f)" /><text x="390" y="76" text-anchor="middle" class="l">real</text><text x="296" y="156" text-anchor="end" class="l">relativo</text><text x="410" y="172" text-anchor="start" class="l">aparente</text><text x="500" y="260" text-anchor="middle" class="s">Las flechas indican hacia dónde va el aire.</text><text x="30" y="300" text-anchor="start" class="p"><tspan class="l" style="fill:#1d5f93">Real</tspan>: el que sopla de verdad (el que notaríamos parados).</text><text x="30" y="324" text-anchor="start" class="p"><tspan class="l">Relativo</tspan> (de marcha): igual a nuestra velocidad y contrario al rumbo.</text><text x="30" y="348" text-anchor="start" class="p"><tspan class="l" style="fill:#c2410c">Aparente</tspan>: la suma de los dos; el que se nota a bordo y marcan veleta y anemómetro.</text>
</svg>
