<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="t">
<title id="t">Supervivencia en el agua: cómo saltar, postura HELP y agruparse</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#14202b}
.b{font-weight:700}.p{font-size:15px;fill:#4b5b69}.l{font-size:15px;font-weight:600;fill:#14202b}
.h{fill:#eef2f5;stroke:#14202b;stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.k{fill:none;stroke:#14202b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs><marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker>
<marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1d5f93"/></marker>
<marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5c6b78"/></marker>
<path id="bq" d="M0,-30 C9,-21 11,-9 11,0 L9,24 L-9,24 L-11,0 C-11,-9 -9,-21 0,-30 Z"/>
<path id="llama" d="M0,0 C-22,0 -26,-22 -14,-38 C-12,-26 -6,-24 -4,-30 C-8,-44 2,-58 10,-64 C8,-48 22,-40 20,-22 C26,-28 26,-34 24,-38 C34,-24 30,0 0,0 Z"/></defs>
<rect width="720" height="410" rx="14" fill="#fff"/>
<g stroke="#e3e8ec" stroke-width="2"><line x1="240" y1="16" x2="240" y2="300"/><line x1="480" y1="16" x2="480" y2="300"/></g><text x="120" y="36" text-anchor="middle" class="b">Saltar al agua</text><rect x="10" y="250" width="220" height="50" fill="#d7ebf8"/><rect x="106" y="104" width="28" height="44" rx="6" fill="#f97316" stroke="#14202b" stroke-width="2"/><circle cx="120" cy="86" r="13" fill="#fff" stroke="#14202b" stroke-width="3"/><path class="k" d="M104,116 L134,134 M136,116 L106,134 M117,148 L117,226 M123,148 L123,226 M134,116 L128,94"/><path d="M168,120 L168,220" fill="none" stroke="#5c6b78" stroke-width="3" marker-end="url(#fg)"/><text x="120" y="324" text-anchor="middle" class="p">piernas juntas, brazos cruzados</text><text x="120" y="343" text-anchor="middle" class="p">sujetando el chaleco, nariz tapada</text><text x="360" y="36" text-anchor="middle" class="b">Postura HELP</text><rect x="250" y="150" width="220" height="150" fill="#d7ebf8"/><line x1="250" y1="150" x2="470" y2="150" stroke="#1d5f93" stroke-width="2"/><rect x="344" y="146" width="30" height="44" rx="8" fill="#f97316" stroke="#14202b" stroke-width="2"/><circle cx="359" cy="130" r="13" fill="#fff" stroke="#14202b" stroke-width="3"/><path class="k" d="M352,190 L384,176 L378,214 M360,190 L390,184 L386,220 M344,160 L376,172 M374,160 L346,172"/><text x="360" y="324" text-anchor="middle" class="p">rodillas al pecho y brazos</text><text x="360" y="343" text-anchor="middle" class="p">cruzados: se pierde menos calor</text><text x="600" y="36" text-anchor="middle" class="b">En grupo</text><rect x="490" y="70" width="220" height="230" rx="8" fill="#d7ebf8"/><line x1="600" y1="125" x2="655" y2="180" stroke="#14202b" stroke-width="4" stroke-linecap="round"/><line x1="655" y1="180" x2="600" y2="235" stroke="#14202b" stroke-width="4" stroke-linecap="round"/><line x1="600" y1="235" x2="545" y2="180" stroke="#14202b" stroke-width="4" stroke-linecap="round"/><line x1="545" y1="180" x2="600" y2="125" stroke="#14202b" stroke-width="4" stroke-linecap="round"/><circle cx="600" cy="125" r="20" fill="#f97316" stroke="#14202b" stroke-width="2"/><circle cx="600" cy="125" r="10" fill="#fff" stroke="#14202b" stroke-width="2"/><circle cx="655" cy="180" r="20" fill="#f97316" stroke="#14202b" stroke-width="2"/><circle cx="655" cy="180" r="10" fill="#fff" stroke="#14202b" stroke-width="2"/><circle cx="600" cy="235" r="20" fill="#f97316" stroke="#14202b" stroke-width="2"/><circle cx="600" cy="235" r="10" fill="#fff" stroke="#14202b" stroke-width="2"/><circle cx="545" cy="180" r="20" fill="#f97316" stroke="#14202b" stroke-width="2"/><circle cx="545" cy="180" r="10" fill="#fff" stroke="#14202b" stroke-width="2"/><text x="600" y="324" text-anchor="middle" class="p">abrazados en círculo:</text><text x="600" y="343" text-anchor="middle" class="p">menos frío y más visibles</text><text x="360" y="380" text-anchor="middle" class="p">En el agua, moverse lo mínimo y no quitarse la ropa; nadar solo hacia algo cercano y seguro.</text>
</svg>
