<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" role="img" aria-labelledby="t">
<title id="t">Embarcación vista desde arriba: proa, popa, crujía, babor, estribor, amuras, través y aletas</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#14202b}
.b{font-weight:700}.p{font-size:16px;fill:#4b5b69}
.ln{stroke:#14202b;stroke-width:1.5;fill:none}
</style>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#14202b"/></marker></defs>
<rect width="600" height="460" rx="14" fill="#fff"/>
<path d="M300,40 C240,90 190,150 190,230 L200,380 L300,380 Z" fill="#fbe3e3"/>
<path d="M300,40 C360,90 410,150 410,230 L400,380 L300,380 Z" fill="#dff3e6"/>
<path d="M300,40 C360,90 410,150 410,230 L400,380 L200,380 L190,230 C190,150 240,90 300,40 Z" fill="none" stroke="#14202b" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="300" y1="30" x2="300" y2="392" stroke="#14202b" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="300" y="100" text-anchor="middle" class="b">PROA</text>
<text x="300" y="366" text-anchor="middle" class="b">POPA</text>
<text x="300" y="412" text-anchor="middle" class="p">línea de crujía</text>
<text x="248" y="260" text-anchor="middle" class="b" style="fill:#b42318">BABOR</text>
<text x="352" y="260" text-anchor="middle" class="b" style="fill:#13773d">ESTRIBOR</text>
<line class="ln" x1="174" y1="104" x2="222" y2="124"/>
