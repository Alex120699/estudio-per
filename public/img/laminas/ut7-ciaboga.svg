<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t">
<title id="t">Ciaboga con una hélice dextrógira y con dos hélices de giro al exterior</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#14202b}
.b{font-weight:700}.p{font-size:15px;fill:#4b5b69}.l{font-size:15px;font-weight:600;fill:#14202b}
.h{fill:#eef2f5;stroke:#14202b;stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
</style>
<defs><marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker>
<marker id="fv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#15803d"/></marker>
<marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5c6b78"/></marker>
<path id="bq" d="M0,-30 C9,-21 11,-9 11,0 L9,24 L-9,24 L-11,0 C-11,-9 -9,-21 0,-30 Z"/></defs>
<rect width="720" height="380" rx="14" fill="#fff"/>
<line x1="360" y1="16" x2="360" y2="350" stroke="#e3e8ec" stroke-width="2"/><text x="180" y="36" text-anchor="middle" class="b">Una hélice dextrógira</text><g transform="translate(180 200) rotate(0) scale(2.4)"><use href="#bq" class="h"/></g><path d="M120,86 A75,55 0 0 1 240,86" fill="none" stroke="#15803d" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#fv)"/><path d="M190,128 Q205,110 236,100" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#f)"/><text x="242" y="104" text-anchor="start" class="p">1 avante,</text><text x="242" y="123" text-anchor="start" class="p">timón a Er</text><path d="M170,258 Q150,270 118,268" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#f)"/><text x="112" y="296" text-anchor="start" class="p">2 atrás, timón a Br:</text><text x="112" y="315" text-anchor="start" class="p">la popa cae a babor</text><text x="180" y="338" text-anchor="middle" class="p">repetir: gira por estribor</text><text x="180" y="357" text-anchor="middle" class="p">(levógira: al revés, por babor)</text><text x="540" y="36" text-anchor="middle" class="b">Dos hélices de giro al exterior</text><g transform="translate(540 200) rotate(0) scale(2.4)"><use href="#bq" class="h"/></g><path d="M480,86 A75,55 0 0 1 600,86" fill="none" stroke="#15803d" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#fv)"/><path d="M505,262 L505,196" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#f)"/><path d="M575,196 L575,262" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#f)"/><text x="498" y="236" text-anchor="end" class="p">babor</text><text x="498" y="255" text-anchor="end" class="p">avante</text><text x="584" y="222" text-anchor="start" class="p">estribor</text><text x="584" y="241" text-anchor="start" class="p">atrás</text><text x="540" y="338" text-anchor="middle" class="p">cae a estribor casi sobre sí mismo</text><text x="540" y="357" text-anchor="middle" class="p">(para caer a babor, al revés)</text>
</svg>
