<rect x="10" y="10" width="700" height="330" rx="10" fill="#d7ebf8"/><path d="M380,10 Q420,80 470,110 Q520,140 560,200 Q600,260 610,340 L710,340 L710,10 Z" fill="#e9dcc2" stroke="#8a6d3b" stroke-width="2"/><rect x="30" y="24" width="660" height="300" fill="none" stroke="#14202b" stroke-width="3"/><text x="36" y="42" class="l" style="fill:#14202b">General</text><rect x="200" y="50" width="470" height="260" fill="none" stroke="#1d5f93" stroke-width="3"/><text x="206" y="68" class="l" style="fill:#1d5f93">De arrumbamiento</text><rect x="340" y="80" width="300" height="200" fill="none" stroke="#15803d" stroke-width="3"/><text x="346" y="98" class="l" style="fill:#15803d">De recalada</text><rect x="430" y="110" width="190" height="140" fill="none" stroke="#c2410c" stroke-width="3"/><text x="436" y="128" class="l" style="fill:#c2410c">Costera</text><rect x="500" y="160" width="90" height="70" fill="none" stroke="#7c3aed" stroke-width="3"/><text x="506" y="178" class="l" style="fill:#7c3aed">Portulano</text><text x="360" y="372" text-anchor="middle" class="p">De más extensión a más detalle. El portulano da el máximo detalle de un puerto o fondeadero;</text><text x="360" y="391" text-anchor="middle" class="p">un cartucho es un portulano impreso dentro de otra carta.</text>
