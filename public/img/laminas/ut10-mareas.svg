<rect x="10" y="150" width="700" height="250" fill="#d7ebf8"/><path d="M10,400 L10,380 Q200,360 350,340 Q500,320 710,300 L710,400 Z" fill="#c8b48c" stroke="#8a6d3b" stroke-width="2"/><line x1="160" y1="110" x2="560" y2="110" stroke="#1d5f93" stroke-width="2" stroke-dasharray="6 5"/><text x="150" y="115" text-anchor="end" class="l" style="fill:#1d5f93">Pleamar</text><line x1="160" y1="160" x2="560" y2="160" stroke="#14202b" stroke-width="2" /><text x="150" y="165" text-anchor="end" class="l" style="fill:#14202b">nivel ahora</text><line x1="160" y1="220" x2="560" y2="220" stroke="#1d5f93" stroke-width="2" stroke-dasharray="6 5"/><text x="150" y="225" text-anchor="end" class="l" style="fill:#1d5f93">Bajamar</text><line x1="160" y1="250" x2="560" y2="250" stroke="#7c3aed" stroke-width="2" stroke-dasharray="3 4"/><text x="150" y="255" text-anchor="end" class="l" style="fill:#7c3aed">Cero hidrográfico</text><rect x="10" y="40" width="700" height="110" fill="#fff"/><line x1="160" y1="110" x2="560" y2="110" stroke="#1d5f93" stroke-width="2" stroke-dasharray="6 5"/><text x="150" y="115" text-anchor="end" class="l" style="fill:#1d5f93">Pleamar</text><g transform="translate(450 150) rotate(90) scale(1)"><use href="#bq" class="h"/></g><line x1="250" y1="248" x2="250" y2="336" stroke="#7c3aed" stroke-width="3" marker-start="url(#fk)" marker-end="url(#fk)"/><text x="258" y="297" text-anchor="start" class="l" style="fill:#7c3aed">sonda de la carta</text><line x1="320" y1="248" x2="320" y2="162" stroke="#14202b" stroke-width="3" marker-start="url(#fk)" marker-end="url(#fk)"/><text x="328" y="210" text-anchor="start" class="l" style="fill:#14202b">altura de la marea</text><line x1="500" y1="162" x2="500" y2="316" stroke="#c2410c" stroke-width="3" marker-start="url(#fk)" marker-end="url(#fk)"/><text x="508" y="244" text-anchor="start" class="l" style="fill:#c2410c">profundidad real</text><line x1="600" y1="112" x2="600" y2="218" stroke="#1d5f93" stroke-width="3" marker-start="url(#fk)" marker-end="url(#fk)"/><text x="608" y="170" text-anchor="start" class="l" style="fill:#1d5f93">amplitud</text><text x="360" y="30" text-anchor="middle" class="b">Profundidad real = sonda de la carta + altura de la marea</text><text x="360" y="430" text-anchor="middle" class="p">La sonda se cuenta desde el cero hidrográfico (LAT), casi siempre por debajo de la bajamar.</text><text x="360" y="449" text-anchor="middle" class="p">Presión baja o viento hacia la costa: el mar sube más de lo previsto.</text>
