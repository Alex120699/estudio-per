<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="t">
<title id="t">Efecto de la hélice dando atrás: dextrógira, popa a babor; levógira, popa a estribor</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#14202b}
.b{font-weight:700}.p{font-size:15px;fill:#4b5b69}.l{font-size:15px;font-weight:600;fill:#14202b}
.h{fill:#eef2f5;stroke:#14202b;stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
</style>
<defs><marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker>
<marker id="fv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#15803d"/></marker>
<marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5c6b78"/></marker>
<path id="bq" d="M0,-30 C9,-21 11,-9 11,0 L9,24 L-9,24 L-11,0 C-11,-9 -9,-21 0,-30 Z"/></defs>
<rect width="720" height="370" rx="14" fill="#fff"/>
<line x1="360" y1="16" x2="360" y2="300" stroke="#e3e8ec" stroke-width="2"/><text x="180" y="36" text-anchor="middle" class="b">Hélice dextrógira</text><text x="180" y="58" text-anchor="middle" class="p">parado, timón a la vía, máquina atrás</text><g transform="translate(180 180) rotate(0) scale(2.4)"><use href="#bq" class="h"/></g><path d="M180,252 L180,292" stroke="#5c6b78" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#fg)"/><text x="190" y="290" class="p">atrás</text><path d="M148,232 Q125,240 90,236" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#f)"/><path d="M196,112 Q225,100 260,106" fill="none" stroke="#5c6b78" stroke-width="3" marker-end="url(#fg)"/><text x="110" y="264" text-anchor="middle" class="l">popa a babor</text><text x="240" y="90" text-anchor="middle" class="p">proa a estribor</text><text x="540" y="36" text-anchor="middle" class="b">Hélice levógira</text><text x="540" y="58" text-anchor="middle" class="p">en las mismas condiciones</text><g transform="translate(540 180) rotate(0) scale(2.4)"><use href="#bq" class="h"/></g><path d="M540,252 L540,292" stroke="#5c6b78" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#fg)"/><text x="550" y="290" class="p">atrás</text><path d="M572,232 Q595,240 630,236" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#f)"/><path d="M524,112 Q495,100 460,106" fill="none" stroke="#5c6b78" stroke-width="3" marker-end="url(#fg)"/><text x="610" y="264" text-anchor="middle" class="l">popa a estribor</text><text x="480" y="90" text-anchor="middle" class="p">proa a babor</text><text x="360" y="330" text-anchor="middle" class="p">Dextrógira: vista desde popa, gira a la derecha dando avante. Dando atrás,</text><text x="360" y="349" text-anchor="middle" class="p">la corriente de expulsión y la presión lateral de las palas llevan la popa a babor.</text>
</svg>
