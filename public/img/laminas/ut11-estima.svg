r="start" class="p">3 Tiempo: 20:35 − 18:20 =</text><text x="470" y="186" text-anchor="start" class="p">   2 h 15 min = 2,25 h</text><text x="470" y="208" text-anchor="start" class="p">4 Distancia = 6 × 2,25 = 13,5 M</text><text x="470" y="230" text-anchor="start" class="p">5 Trazar el Rv y medir la</text><text x="470" y="252" text-anchor="start" class="p">   distancia en la escala</text><text x="470" y="274" text-anchor="start" class="p">   de latitudes</text><text x="470" y="296" text-anchor="start" class="p">6 Leer las coordenadas</text>
