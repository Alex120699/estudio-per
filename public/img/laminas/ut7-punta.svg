<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t">
<title id="t">Atraque en punta: largos de proa en cruz y muerto a popa</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#14202b}
.b{font-weight:700}.p{font-size:15px;fill:#4b5b69}.l{font-size:15px;font-weight:600;fill:#14202b}
.h{fill:#eef2f5;stroke:#14202b;stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
</style>
<defs><marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker>
<marker id="fv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#15803d"/></marker>
<marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5c6b78"/></marker>
<path id="bq" d="M0,-30 C9,-21 11,-9 11,0 L9,24 L-9,24 L-11,0 C-11,-9 -9,-21 0,-30 Z"/></defs>
<rect width="720" height="430" rx="14" fill="#fff"/>
<rect x="10" y="80" width="460" height="340" fill="#e8f3fb"/><rect x="10" y="44" width="460" height="36" fill="#c8b48c" stroke="#8a6d3b" stroke-width="2"/><text x="90" y="68" text-anchor="middle" class="l">pantalán</text><g opacity=".35"><g transform="translate(110 200) rotate(0) scale(3.2)"><use href="#bq" class="h"/></g><g transform="translate(370 200) rotate(0) scale(3.2)"><use href="#bq" class="h"/></g></g><g transform="translate(240 200) rotate(0) scale(3.2)"><use href="#bq" class="h"/></g><path d="M232,112 L282,80" fill="none" stroke="#1d5f93" stroke-width="3" stroke-linecap="round"/><path d="M248,112 L198,80" fill="none" stroke="#1d5f93" stroke-width="3" stroke-linecap="round"/><circle cx="282" cy="82" r="5" fill="#14202b"/><circle cx="198" cy="82" r="5" fill="#14202b"/><path d="M240,276 L240,380" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round"/><rect x="222" y="380" width="36" height="22" rx="3" fill="#5c6b78" stroke="#14202b" stroke-width="2"/><text x="350" y="67" text-anchor="middle" class="l">largos de proa en cruz</text><text x="266" y="350" text-anchor="start" class="p">muerto o codera</text><text x="266" y="369" text-anchor="start" class="p">a popa</text><text x="490" y="70" text-anchor="start" class="b">Atraque en punta</text><text x="490" y="110" text-anchor="start" class="p">Primero el cabo que</text><text x="490" y="129" text-anchor="start" class="p">aguanta contra el viento:</text><text x="490" y="170" text-anchor="start" class="p"><tspan class="l">Viento de tierra</tspan></text><text x="490" y="189" text-anchor="start" class="p">(de proa): primero</text><text x="490" y="208" text-anchor="start" class="p">los largos de proa.</text><text x="490" y="250" text-anchor="start" class="p"><tspan class="l">Viento de mar</tspan></text><text x="490" y="269" text-anchor="start" class="p">(de popa): primero</text><text x="490" y="288" text-anchor="start" class="p">el muerto o codera.</text><text x="490" y="330" text-anchor="start" class="p">El cabo del muerto</text><text x="490" y="349" text-anchor="start" class="p">se coge con el bichero</text><text x="490" y="368" text-anchor="start" class="p">por la guía del muelle.</text>
</svg>
