.h{fill:#eef2f5;stroke:#14202b;stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
</style>
<defs><marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker>
<marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1d5f93"/></marker>
<marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5c6b78"/></marker>
<marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#14202b"/></marker>
<path id="bq" d="M0,-30 C9,-21 11,-9 11,0 L9,24 L-9,24 L-11,0 C-11,-9 -9,-21 0,-30 Z"/>
<g id="faro"><path d="M-7,0 L-4,-26 L4,-26 L7,0 Z" fill="#fff" stroke="#14202b" stroke-width="2"/><rect x="-5" y="-34" width="10" height="8" fill="#facc15" stroke="#14202b" stroke-width="1.5"/><path d="M-4,-17 L4,-17" stroke="#dc2626" stroke-width="4"/></g></defs>
<rect width="720" height="420" rx="14" fill="#fff"/>
<rect x="10" y="10" width="440" height="400" rx="8" fill="#e8f3fb"/><line x1="70" y1="10" x2="70" y2="410" stroke="#c9dcea" stroke-width="1"/><line x1="140" y1="10" x2="140" y2="410" stroke="#c9dcea" stroke-width="1"/><line x1="210" y1="10" x2="210" y2="410" stroke="#c9dcea" stroke-width="1"/><line x1="280" y1="10" x2="280" y2="410" stroke="#c9dcea" stroke-width="1"/><line x1="350" y1="10" x2="350" y2="410" stroke="#c9dcea" stroke-width="1"/><line x1="420" y1="10" x2="420" y2="410" stroke="#c9dcea" stroke-width="1"/><line x1="10" y1="70" x2="450" y2="70" stroke="#c9dcea" stroke-width="1"/><line x1="10" y1="140" x2="450" y2="140" stroke="#c9dcea" stroke-width="1"/><line x1="10" y1="210" x2="450" y2="210" stroke="#c9dcea" stroke-width="1"/><line x1="10" y1="280" x2="450" y2="280" stroke="#c9dcea" stroke-width="1"/><line x1="10" y1="350" x2="450" y2="350" stroke="#c9dcea" stroke-width="1"/><path d="M10,10 L450,10 L450,70 Q380,110 330,120 Q290,125 260,100 Q200,60 120,80 Q60,95 10,80 Z" fill="#e9dcc2" stroke="#8a6d3b" stroke-width="2"/><circle cx="300" cy="140" r="80" fill="#fde2e2" fill-opacity=".5" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5"/><g transform="translate(300 144)"><use href="#faro"/></g><circle cx="300" cy="140" r="4" fill="#14202b"/><line x1="300" y1="140" x2="339" y2="209.9" stroke="#5c6b78" stroke-width="1.5"/><text x="327.5" y="178.95" text-anchor="start" class="l">2 M</text><line x1="70" y1="360" x2="443.8" y2="151.4" stroke="#1d5f93" stroke-width="3" marker-end="url(#fa)"/><circle cx="70" cy="360" r="6" fill="#14202b"/><text x="82" y="382" text-anchor="start" class="l">salida</text><line x1="70" y1="360" x2="70" y2="300" stroke="#14202b" stroke-width="1.5" marker-end="url(#fk)"/><text x="74" y="296" class="s">N</text><circle cx="339" cy="209.9" r="4" fill="#1d5f93"/><text x="470" y="50" text-anchor="start" class="b">Pasar a una distancia</text><text x="470" y="86" text-anchor="start" class="p">1 Círculo con centro en el</text><text x="470" y="108" text-anchor="start" class="p">   faro y radio la distancia</text><text x="470" y="130" text-anchor="start" class="p">   pedida (escala de latitudes).</text><text x="470" y="152" text-anchor="start" class="p">2 Desde la salida, trazar la</text><text x="470" y="174" text-anchor="start" class="p">   tangente al círculo.</text><text x="470" y="196" text-anchor="start" class="p">3 Medir su Rv y pasarlo a</text><text x="470" y="218" text-anchor="start" class="p">   aguja: Ra = Rv − Ct.</text><text x="470" y="260" text-anchor="start" class="p">Hora de llegada:</text><text x="470" y="279" text-anchor="start" class="p">tiempo = distancia / velocidad;</text><text x="470" y="298" text-anchor="start" class="p">HRB llegada = salida + tiempo.</text>
