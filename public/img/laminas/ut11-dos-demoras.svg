<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t">
<title id="t">Situación por dos demoras simultáneas: se trazan las opuestas desde los faros</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#14202b}
.b{font-weight:700}.p{font-size:15px;fill:#4b5b69}.l{font-size:15px;font-weight:600;fill:#14202b}.s{font-size:14px;fill:#4b5b69}
.h{fill:#eef2f5;stroke:#14202b;stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
</style>
<defs><marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker>
<marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1d5f93"/></marker>
<marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5c6b78"/></marker>
<marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#14202b"/></marker>
<path id="bq" d="M0,-30 C9,-21 11,-9 11,0 L9,24 L-9,24 L-11,0 C-11,-9 -9,-21 0,-30 Z"/>
<g id="faro"><path d="M-7,0 L-4,-26 L4,-26 L7,0 Z" fill="#fff" stroke="#14202b" stroke-width="2"/><rect x="-5" y="-34" width="10" height="8" fill="#facc15" stroke="#14202b" stroke-width="1.5"/><path d="M-4,-17 L4,-17" stroke="#dc2626" stroke-width="4"/></g></defs>
<rect width="720" height="420" rx="14" fill="#fff"/>
<rect x="10" y="10" width="440" height="400" rx="8" fill="#e8f3fb"/><line x1="70" y1="10" x2="70" y2="410" stroke="#c9dcea" stroke-width="1"/><line x1="140" y1="10" x2="140" y2="410" stroke="#c9dcea" stroke-width="1"/><line x1="210" y1="10" x2="210" y2="410" stroke="#c9dcea" stroke-width="1"/><line x1="280" y1="10" x2="280" y2="410" stroke="#c9dcea" stroke-width="1"/><line x1="350" y1="10" x2="350" y2="410" stroke="#c9dcea" stroke-width="1"/><line x1="420" y1="10" x2="420" y2="410" stroke="#c9dcea" stroke-width="1"/><line x1="10" y1="70" x2="450" y2="70" stroke="#c9dcea" stroke-width="1"/><line x1="10" y1="140" x2="450" y2="140" stroke="#c9dcea" stroke-width="1"/><line x1="10" y1="210" x2="450" y2="210" stroke="#c9dcea" stroke-width="1"/><line x1="10" y1="280" x2="450" y2="280" stroke="#c9dcea" stroke-width="1"/><line x1="10" y1="350" x2="450" y2="350" stroke="#c9dcea" stroke-width="1"/><path d="M10,10 L450,10 L450,90 Q380,120 330,100 Q260,80 200,110 Q140,140 80,120 Q40,110 10,130 Z" fill="#e9dcc2" stroke="#8a6d3b" stroke-width="2"/><line x1="120" y1="125" x2="276" y2="352.5" stroke="#c2410c" stroke-width="2.5"/><line x1="370" y1="100" x2="201" y2="360" stroke="#1d5f93" stroke-width="2.5"/><g transform="translate(120 129)"><use href="#faro"/></g><circle cx="120" cy="125" r="4" fill="#14202b"/><g transform="translate(370 104)"><use href="#faro"/></g><circle cx="370" cy="100" r="4" fill="#14202b"/><line x1="90" y1="135" x2="90" y2="95" stroke="#14202b" stroke-width="1.5" marker-end="url(#fk)"/><text x="94" y="91" class="s">N</text><line x1="400" y1="120" x2="400" y2="80" stroke="#14202b" stroke-width="1.5" marker-end="url(#fk)"/><text x="404" y="76" class="s">N</text><circle cx="240" cy="300" r="8" fill="none" stroke="#14202b" stroke-width="3"/><circle cx="240" cy="300" r="2.5" fill="#14202b"/><text x="254" y="326" text-anchor="start" class="l">situación</text><text x="134" y="165" text-anchor="start" class="s">Dv 326°</text><text x="134" y="184" text-anchor="start" class="s">traza 146°</text><text x="366" y="150" text-anchor="end" class="s">Dv 033°</text><text x="366" y="169" text-anchor="end" class="s">traza 213°</text><text x="470" y="50" text-anchor="start" class="b">Dos demoras</text><text x="470" y="86" text-anchor="start" class="p">1 Pasar cada demora a</text><text x="470" y="105" text-anchor="start" class="p">verdadera: Dv = Da + Ct</text><text x="470" y="124" text-anchor="start" class="p">(o Dv = Rv + M).</text><text x="470" y="160" text-anchor="start" class="p">2 Desde cada faro, trazar</text><text x="470" y="179" text-anchor="start" class="p">la opuesta: Dv ± 180°</text><text x="470" y="198" text-anchor="start" class="p">(la demora se toma desde</text><text x="470" y="217" text-anchor="start" class="p">el barco hacia el faro).</text><text x="470" y="254" text-anchor="start" class="p">3 El corte de las dos</text><text x="470" y="273" text-anchor="start" class="p">líneas es la situación.</text><text x="470" y="292" text-anchor="start" class="p">Leer latitud y longitud</text><text x="470" y="311" text-anchor="start" class="p">en las escalas.</text>
</svg>
