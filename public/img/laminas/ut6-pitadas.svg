<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 562" role="img" aria-labelledby="t">
<title id="t">Señales acústicas de maniobra y de visibilidad reducida</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#14202b}
.b{font-weight:700}.p{font-size:15px;fill:#4b5b69}.l{font-size:15px;font-weight:600;fill:#14202b}
.n{font-size:15px;fill:#e5edf5}.nb{font-size:16px;font-weight:700;fill:#fff}
.h{fill:#eef2f5;stroke:#14202b;stroke-width:2;stroke-linejoin:round}
.fl{fill:none;stroke:#c2410c;stroke-width:3}
</style>
<defs><marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker>
<marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5c6b78"/></marker>
<path id="bq" d="M0,-30 C9,-21 11,-9 11,0 L9,24 L-9,24 L-11,0 C-11,-9 -9,-21 0,-30 Z"/></defs>
<rect width="720" height="562" rx="14" fill="#fff"/>
<text x="24" y="40" class="b">A la vista (regla 34)</text><rect x="24" y="65" width="16" height="16" rx="8" fill="#1d5f93"/><text x="300" y="79" class="p" style="font-size:16px;fill:#14202b">caigo a estribor</text><rect x="24" y="95" width="16" height="16" rx="8" fill="#1d5f93"/><rect x="48" y="95" width="16" height="16" rx="8" fill="#1d5f93"/><text x="300" y="109" class="p" style="font-size:16px;fill:#14202b">caigo a babor</text><rect x="24" y="125" width="16" height="16" rx="8" fill="#1d5f93"/><rect x="48" y="125" width="16" height="16" rx="8" fill="#1d5f93"/><rect x="72" y="125" width="16" height="16" rx="8" fill="#1d5f93"/><text x="300" y="139" class="p" style="font-size:16px;fill:#14202b">estoy dando atrás</text><rect x="24" y="155" width="16" height="16" rx="8" fill="#1d5f93"/><rect x="48" y="155" width="16" height="16" rx="8" fill="#1d5f93"/><rect x="72" y="155" width="16" height="16" rx="8" fill="#1d5f93"/><rect x="96" y="155" width="16" height="16" rx="8" fill="#1d5f93"/><rect x="120" y="155" width="16" height="16" rx="8" fill="#1d5f93"/><text x="300" y="169" class="p" style="font-size:16px;fill:#14202b">duda: no entiendo su maniobra</text><rect x="24" y="185" width="56" height="16" rx="8" fill="#1d5f93"/><text x="300" y="199" class="p" style="font-size:16px;fill:#14202b">me acerco a un recodo (y respuesta)</text><rect x="24" y="215" width="56" height="16" rx="8" fill="#1d5f93"/><rect x="88" y="215" width="56" height="16" rx="8" fill="#1d5f93"/><rect x="152" y="215" width="16" height="16" rx="8" fill="#1d5f93"/><text x="300" y="229" class="p" style="font-size:16px;fill:#14202b">canal angosto: le alcanzo por su estribor</text><rect x="24" y="245" width="56" height="16" rx="8" fill="#1d5f93"/><rect x="88" y="245" width="56" height="16" rx="8" fill="#1d5f93"/><rect x="152" y="245" width="16" height="16" rx="8" fill="#1d5f93"/><rect x="176" y="245" width="16" height="16" rx="8" fill="#1d5f93"/><text x="300" y="259" class="p" style="font-size:16px;fill:#14202b">canal angosto: le alcanzo por su babor</text><rect x="24" y="275" width="56" height="16" rx="8" fill="#1d5f93"/><rect x="88" y="275" width="16" height="16" rx="8" fill="#1d5f93"/><rect x="112" y="275" width="56" height="16" rx="8" fill="#1d5f93"/><rect x="176" y="275" width="16" height="16" rx="8" fill="#1d5f93"/><text x="300" y="289" class="p" style="font-size:16px;fill:#14202b">conformidad del alcanzado</text><text x="24" y="330" class="b">Visibilidad reducida (regla 35), cada 2 min como máximo</text><rect x="24" y="355" width="56" height="16" rx="8" fill="#1d5f93"/><text x="300" y="369" class="p" style="font-size:16px;fill:#14202b">propulsión mecánica con arrancada</text><rect x="24" y="385" width="56" height="16" rx="8" fill="#1d5f93"/><rect x="98" y="385" width="56" height="16" rx="8" fill="#1d5f93"/><text x="300" y="399" class="p" style="font-size:16px;fill:#14202b">propulsión mecánica parado, sin arrancada</text><rect x="24" y="415" width="56" height="16" rx="8" fill="#1d5f93"/><rect x="88" y="415" width="16" height="16" rx="8" fill="#1d5f93"/><rect x="112" y="415" width="16" height="16" rx="8" fill="#1d5f93"/><text x="300" y="429" class="p" style="font-size:16px;fill:#14202b">sin gobierno, restringido, calado, vela, pesca, remolcando</text><rect x="24" y="445" width="56" height="16" rx="8" fill="#1d5f93"/><rect x="88" y="445" width="16" height="16" rx="8" fill="#1d5f93"/><rect x="112" y="445" width="16" height="16" rx="8" fill="#1d5f93"/><rect x="136" y="445" width="16" height="16" rx="8" fill="#1d5f93"/><text x="300" y="459" class="p" style="font-size:16px;fill:#14202b">remolcado (el último, si va tripulado)</text><rect x="24" y="475" width="16" height="16" rx="8" fill="#1d5f93"/><rect x="48" y="475" width="16" height="16" rx="8" fill="#1d5f93"/><rect x="72" y="475" width="16" height="16" rx="8" fill="#1d5f93"/><rect x="96" y="475" width="16" height="16" rx="8" fill="#1d5f93"/><text x="300" y="489" class="p" style="font-size:16px;fill:#14202b">práctico (además de la suya)</text><text x="24" y="528" text-anchor="start" class="p">Corta: unos 1 s. Larga: de 4 a 6 s. Fondeado: campana rápida unos 5 s cada minuto.</text><text x="24" y="547" text-anchor="start" class="p">Varado: tres campanadas, campana rápida y tres campanadas.</text>
</svg>
