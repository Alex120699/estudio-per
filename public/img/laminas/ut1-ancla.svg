<circle cx="300" cy="302" r="16" class="m"/>
<line class="ln" x1="322" y1="44" x2="380" y2="44"/><text x="384" y="40">Grillete de unión</text><text x="384" y="62" class="p">(une ancla y cadena)</text>
<line class="ln" x1="282" y1="72" x2="220" y2="72"/><text x="216" y="78" text-anchor="end">Arganeo</text>
