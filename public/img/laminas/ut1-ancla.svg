<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-labelledby="t">
<title id="t">Partes del ancla sin cepo: arganeo, caña, cruz, brazos y uñas, con el grillete de unión a la cadena</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#14202b}
.b{font-weight:700}.p{font-size:16px;fill:#4b5b69}
.ln{stroke:#14202b;stroke-width:1.5;fill:none}
.m{fill:#6b7a87;stroke:#14202b;stroke-width:2;stroke-linejoin:round}
</style>
<rect width="600" height="440" rx="14" fill="#fff"/>
<g fill="none" stroke="#4b5b69" stroke-width="6">
<ellipse cx="300" cy="22" rx="9" ry="14"/><ellipse cx="300" cy="-4" rx="9" ry="14"/>
</g>
<path d="M286,40 Q286,30 300,30 Q314,30 314,40 L314,52 L286,52 Z" fill="none" stroke="#c2410c" stroke-width="6"/>
