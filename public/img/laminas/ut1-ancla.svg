<circle cx="300" cy="72" r="17" fill="none" stroke="#14202b" stroke-width="8"/>
<rect x="290" y="88" width="20" height="214" class="m"/>
<path d="M300,300 Q240,316 186,252" fill="none" stroke="#6b7a87" stroke-width="20" stroke-linecap="round"/>
<path d="M300,300 Q360,316 414,252" fill="none" stroke="#6b7a87" stroke-width="20" stroke-linecap="round"/>
