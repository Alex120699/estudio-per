<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t">
<title id="t">Regla 12: qué velero se aparta según por dónde recibe el viento</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#14202b}
.b{font-weight:700}.p{font-size:15px;fill:#4b5b69}.l{font-size:15px;font-weight:600;fill:#14202b}
.n{font-size:15px;fill:#e5edf5}.nb{font-size:16px;font-weight:700;fill:#fff}
.h{fill:#eef2f5;stroke:#14202b;stroke-width:2;stroke-linejoin:round}
.fl{fill:none;stroke:#c2410c;stroke-width:3}
</style>
<defs><marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker>
<marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5c6b78"/></marker>
<path id="bq" d="M0,-30 C9,-21 11,-9 11,0 L9,24 L-9,24 L-11,0 C-11,-9 -9,-21 0,-30 Z"/></defs>
<rect width="720" height="400" rx="14" fill="#fff"/>
<line x1="360" y1="16" x2="360" y2="330" stroke="#e3e8ec" stroke-width="2"/><text x="180" y="30" text-anchor="middle" class="b">Bandas contrarias</text><path d="M180,40 L180,86" stroke="#1d5f93" stroke-width="4" marker-end="url(#fg)"/><text x="192" y="62" class="l" style="fill:#1d5f93">viento</text><g transform="translate(110 220) rotate(45) scale(1.5)"><use href="#bq" class="h"/><line x1="0" y1="-8" x2="14" y2="16" stroke="#14202b" stroke-width="3" stroke-linecap="round"/><circle cy="-8" r="3" fill="#14202b"/></g><g transform="translate(250 220) rotate(-45) scale(1.5)"><use href="#bq" class="h"/><line x1="0" y1="-8" x2="-14" y2="16" stroke="#14202b" stroke-width="3" stroke-linecap="round"/><circle cy="-8" r="3" fill="#14202b"/></g><text x="110" y="286" text-anchor="middle" class="p">viento por babor</text><text x="110" y="305" text-anchor="middle" class="p"><tspan style="font-weight:700;fill:#9a3412">se aparta</tspan></text><text x="250" y="286" text-anchor="middle" class="p">viento por estribor</text><text x="250" y="305" text-anchor="middle" class="p">sigue a rumbo</text><text x="540" y="30" text-anchor="middle" class="b">Misma banda</text><path d="M540,40 L540,86" stroke="#1d5f93" stroke-width="4" marker-end="url(#fg)"/><text x="552" y="62" class="l" style="fill:#1d5f93">viento</text><g transform="translate(470 170) rotate(60) scale(1.5)"><use href="#bq" class="h"/><line x1="0" y1="-8" x2="14" y2="16" stroke="#14202b" stroke-width="3" stroke-linecap="round"/><circle cy="-8" r="3" fill="#14202b"/></g><g transform="translate(560 255) rotate(30) scale(1.5)"><use href="#bq" class="h"/><line x1="0" y1="-8" x2="14" y2="16" stroke="#14202b" stroke-width="3" stroke-linecap="round"/><circle cy="-8" r="3" fill="#14202b"/></g><text x="470" y="112" text-anchor="middle" class="p">a barlovento: <tspan style="font-weight:700;fill:#9a3412">se aparta</tspan></text><text x="600" y="318" text-anchor="middle" class="p">a sotavento: sigue a rumbo</text><text x="360" y="352" text-anchor="middle" class="p">La botavara va a sotavento: el viento entra por la banda contraria.</text><text x="360" y="371" text-anchor="middle" class="p">Si va con viento por babor y no sabe cómo lo recibe el otro, se aparta.</text>
</svg>
