or="middle" class="p">del timón</text><text x="250" y="348" text-anchor="middle" class="p">bocina</text><text x="250" y="367" text-anchor="middle" class="p">(eje de la hélice)</text><text x="440" y="348" text-anchor="middle" class="p">grifo de fondo,</text><text x="440" y="367" text-anchor="middle" class="p">manguito y abrazaderas</text><text x="620" y="348" text-anchor="middle" class="p">transductor</text><text x="620" y="367" text-anchor="middle" class="p">(sonda, corredera)</text><path d="M560,40 L660,30 L660,70 L560,60 Z" fill="#d6b98c" stroke="#8a6d3b" stroke-width="2"/><text x="610" y="92" text-anchor="middle" class="l">espiche: tapón cónico</text><text x="40" y="50" text-anchor="start" class="p"><tspan class="b">Vías de agua</tspan></text><text x="40" y="76" text-anchor="start" class="p">puntos de mayor riesgo</text><text x="360" y="412" text-anchor="middle" class="p">La hélice no es un punto de entrada de agua. Localizar, achicar con las bombas</text><text x="360" y="431" text-anchor="middle" class="p">y taponar con espiches o, por fuera, con una colchoneta o lona.</text>
