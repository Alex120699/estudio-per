<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t">
<title id="t">Curva de evolución en tres fases y rabeo de la popa</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#14202b}
.b{font-weight:700}.p{font-size:15px;fill:#4b5b69}.l{font-size:15px;font-weight:600;fill:#14202b}
.h{fill:#eef2f5;stroke:#14202b;stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
</style>
<defs><marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker>
<marker id="fv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#15803d"/></marker>
<marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5c6b78"/></marker>
<path id="bq" d="M0,-30 C9,-21 11,-9 11,0 L9,24 L-9,24 L-11,0 C-11,-9 -9,-21 0,-30 Z"/></defs>
<rect width="720" height="520" rx="14" fill="#fff"/>
<path d="M200,400 L200,320" fill="none" stroke="#1d5f93" stroke-width="4"/><path d="M200,320 C200,262 300,272 300,200" fill="none" stroke="#c2410c" stroke-width="4"/><path d="M300,200 A90,90 0 1 1 480,200 A90,90 0 0 1 330,266" fill="none" stroke="#15803d" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#fv)"/><g transform="translate(200 430) rotate(0) scale(0.9)"><use href="#bq" class="h"/></g><g transform="translate(214 300) rotate(22) scale(0.9)"><use href="#bq" class="h"/></g><path d="M196,322 Q178,328 160,322" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#f)"/><text x="150" y="300" text-anchor="end" class="p">rabeo:</text><text x="150" y="319" text-anchor="end" class="p">la popa sale</text><text x="150" y="338" text-anchor="end" class="p">hacia fuera</text><text x="218" y="372" text-anchor="start" class="l">1 Maniobra</text><text x="218" y="390" text-anchor="start" class="p">se mete el timón; aún no gira</text><text x="310" y="316" text-anchor="start" class="l">2 Evolución</text><text x="310" y="334" text-anchor="start" class="p">va girando cada vez más</text><text x="390" y="196" text-anchor="middle" class="l">3 Uniforme</text><text x="390" y="214" text-anchor="middle" class="p">círculo constante</text><text x="560" y="92" text-anchor="start" class="p">Timón a estribor,</text><text x="560" y="111" text-anchor="start" class="p">marcha avante.</text><text x="360" y="482" text-anchor="middle" class="p">Curva de evolución: maniobra, evolución (variable) y uniforme. Al empezar a girar,</text><text x="360" y="501" text-anchor="middle" class="p">la popa se desplaza hacia la banda contraria a la que se mete el timón.</text>
</svg>
