<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 556" role="img" aria-labelledby="t">
<title id="t">Amarras de un barco atracado de costado: largos, traveses y esprines</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#14202b}
.b{font-weight:700}.p{font-size:15px;fill:#4b5b69}.l{font-size:15px;font-weight:600;fill:#14202b}
.h{fill:#eef2f5;stroke:#14202b;stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
</style>
<defs><marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker>
<marker id="fv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#15803d"/></marker>
<marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5c6b78"/></marker>
<path id="bq" d="M0,-30 C9,-21 11,-9 11,0 L9,24 L-9,24 L-11,0 C-11,-9 -9,-21 0,-30 Z"/></defs>
<rect width="720" height="556" rx="14" fill="#fff"/>
<rect x="10" y="10" width="700" height="310" rx="10" fill="#e8f3fb"/><rect x="10" y="320" width="700" height="40" fill="#c8b48c" stroke="#8a6d3b" stroke-width="2"/><g transform="translate(360 262)"><path d="M-170,-32 L110,-32 C160,-32 185,-10 190,0 C185,10 160,32 110,32 L-170,32 Z" class="h"/></g><text x="500" y="268" text-anchor="middle" class="l">PROA</text><text x="220" y="268" text-anchor="middle" class="l">POPA</text><rect x="243" y="294" width="14" height="10" rx="3" fill="#facc15" stroke="#14202b"/><rect x="463" y="294" width="14" height="10" rx="3" fill="#facc15" stroke="#14202b"/><path d="M530,280 L650,330" fill="none" stroke="#1d5f93" stroke-width="3" stroke-linecap="round"/><circle cx="650" cy="332" r="5" fill="#14202b"/><path d="M480,290 L480,330" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round"/><circle cx="480" cy="332" r="5" fill="#14202b"/><path d="M505,288 L410,330" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round"/><circle cx="410" cy="332" r="5" fill="#14202b"/><path d="M235,288 L330,330" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round"/><circle cx="330" cy="332" r="5" fill="#14202b"/><path d="M260,290 L260,330" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round"/><circle cx="260" cy="332" r="5" fill="#14202b"/><path d="M200,278 L90,330" fill="none" stroke="#1d5f93" stroke-width="3" stroke-linecap="round"/><circle cx="90" cy="332" r="5" fill="#14202b"/><text x="650" y="384" text-anchor="middle" class="l">Largo de proa</text><text x="330" y="384" text-anchor="middle" class="l">Esprín de popa</text><text x="90" y="384" text-anchor="middle" class="l">Largo de popa</text><text x="480" y="384" text-anchor="middle" class="l">Través de proa</text><text x="260" y="406" text-anchor="middle" class="l">Través de popa</text><text x="430" y="406" text-anchor="middle" class="l">Esprín de proa</text><text x="360" y="60" text-anchor="middle" class="b">Barco atracado de costado: los esprines trabajan en diagonal</text><text x="360" y="100" text-anchor="middle" class="p">El esprín de proa sale de proa y va a tierra hacia popa;</text><text x="360" y="119" text-anchor="middle" class="p">el de popa sale de popa y va a tierra hacia proa.</text><text x="30" y="448" text-anchor="start" class="p"><tspan class="l">Al cobrar…</tspan></text><text x="30" y="467" text-anchor="start" class="p">largo de proa: avante y acerca la proa</text><text x="30" y="486" text-anchor="start" class="p">esprín de proa: atrás y acerca la proa</text><text x="30" y="505" text-anchor="start" class="p">través: se acerca paralelo</text><text x="380" y="467" text-anchor="start" class="p">esprín de popa: avante y acerca la popa</text><text x="380" y="486" text-anchor="start" class="p">largo de popa: atrás y acerca la popa</text><text x="360" y="530" text-anchor="middle" class="p">Con viento o corriente de proa trabajan el largo de proa y el esprín de popa.</text>
</svg>
