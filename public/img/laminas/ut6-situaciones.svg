<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="t">
<title id="t">Vuelta encontrada, cruce y alcance entre buques de propulsión mecánica</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#14202b}
.b{font-weight:700}.p{font-size:15px;fill:#4b5b69}.l{font-size:15px;font-weight:600;fill:#14202b}
.n{font-size:15px;fill:#e5edf5}.nb{font-size:16px;font-weight:700;fill:#fff}
.h{fill:#eef2f5;stroke:#14202b;stroke-width:2;stroke-linejoin:round}
.fl{fill:none;stroke:#c2410c;stroke-width:3}
</style>
<defs><marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker>
<marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5c6b78"/></marker>
<path id="bq" d="M0,-30 C9,-21 11,-9 11,0 L9,24 L-9,24 L-11,0 C-11,-9 -9,-21 0,-30 Z"/></defs>
<rect width="760" height="390" rx="14" fill="#fff"/>
<g stroke="#e3e8ec" stroke-width="2"><line x1="253" y1="16" x2="253" y2="300"/><line x1="506" y1="16" x2="506" y2="300"/></g><text x="126" y="36" text-anchor="middle" class="b">Vuelta encontrada</text><g transform="translate(140 250) rotate(0) scale(1)"><use href="#bq" class="h"/></g><g transform="translate(112 100) rotate(180) scale(1)"><use href="#bq" class="h"/></g><path class="fl" d="M140,214 Q142,180 178,168" marker-end="url(#f)"/><path class="fl" d="M112,136 Q110,170 74,182" marker-end="url(#f)"/><text x="126" y="312" text-anchor="middle" class="p">los dos caen a estribor</text><text x="126" y="331" text-anchor="middle" class="p">y pasan babor con babor</text><text x="380" y="36" text-anchor="middle" class="b">Cruce</text><g transform="translate(450 130) rotate(-90) scale(1)"><use href="#bq" class="h"/><circle cx="-11" cy="-2" r="6" fill="#ef4444" stroke="#14202b" stroke-width="1.5"/></g><path d="M420,130 L300,130" stroke="#5c6b78" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#fg)"/><g transform="translate(350 260) rotate(0) scale(1)"><use href="#bq" class="h"/></g><path class="fl" d="M350,224 Q352,190 400,184 Q500,180 505,100" marker-end="url(#f)"/><text x="330" y="116" text-anchor="middle" class="p">sigue a rumbo</text><text x="380" y="312" text-anchor="middle" class="p">lo tengo por estribor (veo su roja):</text><text x="380" y="331" text-anchor="middle" class="p">me aparto, por su popa</text><text x="633" y="36" text-anchor="middle" class="b">Alcance</text><path d="M633,100 L743.9,145.9 A120,120 0 0 1 522.1,145.9 Z" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/><g transform="translate(633 100) rotate(0) scale(1)"><use href="#bq" class="h"/></g><g transform="translate(645 210) rotate(0) scale(1)"><use href="#bq" class="h"/></g><path class="fl" d="M645,174 Q650,140 680,120 Q692,90 684,50" marker-end="url(#f)"/><text x="633" y="312" text-anchor="middle" class="p">viene de más de 22,5° a popa</text><text x="633" y="331" text-anchor="middle" class="p">del través: se aparta siempre</text><text x="380" y="368" text-anchor="middle" class="p">El que se aparta maniobra pronto y claro; el otro mantiene rumbo y velocidad.</text>
</svg>
