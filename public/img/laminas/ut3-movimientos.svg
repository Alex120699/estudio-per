<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t">
<title id="t">Balance (de banda a banda) y cabezada (proa arriba y abajo)</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#14202b}
.b{font-weight:700}.p{font-size:16px;fill:#4b5b69}
.h{fill:#eef2f5;stroke:#14202b;stroke-width:2.5;stroke-linejoin:round}
.f{fill:none;stroke:#c2410c;stroke-width:3}
</style>
<defs><marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker></defs>
<rect width="720" height="340" rx="14" fill="#fff"/>
<rect x="0" y="200" width="720" height="140" fill="#d7ebf8" rx="14"/>
<line x1="0" y1="200" x2="720" y2="200" stroke="#2b7bbd" stroke-width="2"/>
<line x1="360" y1="20" x2="360" y2="320" stroke="#c4ccd3" stroke-width="2"/>
<g opacity="0.35" transform="rotate(-18 180 200)"><path d="M120,190 L240,190 C234,230 206,250 180,256 C154,250 126,230 120,190 Z" class="h"/><line x1="180" y1="190" x2="180" y2="70" stroke="#14202b" stroke-width="4"/></g>
<g transform="rotate(18 180 200)"><path d="M120,190 L240,190 C234,230 206,250 180,256 C154,250 126,230 120,190 Z" class="h"/><line x1="180" y1="190" x2="180" y2="70" stroke="#14202b" stroke-width="4"/></g>
<path class="f" d="M128,74 A130,130 0 0 1 232,74" marker-start="url(#f)" marker-end="url(#f)"/>
<text x="180" y="40" text-anchor="middle" class="b">Balance</text>
<text x="180" y="290" text-anchor="middle" class="p">de una banda a otra</text>
<text x="180" y="310" text-anchor="middle" class="p">(visto desde popa)</text>
<g opacity="0.35" transform="rotate(10 540 200)"><path d="M420,184 L660,180 C652,206 636,222 616,226 L448,228 C436,220 426,204 420,184 Z" class="h"/></g>
<g transform="rotate(-10 540 200)"><path d="M420,184 L660,180 C652,206 636,222 616,226 L448,228 C436,220 426,204 420,184 Z" class="h"/></g>
<path class="f" d="M676,118 A150,150 0 0 1 690,182" marker-start="url(#f)" marker-end="url(#f)"/>
<text x="540" y="40" text-anchor="middle" class="b">Cabezada</text>
<text x="660" y="100" text-anchor="middle" class="p">proa</text>
<text x="540" y="290" text-anchor="middle" class="p">la proa sube y baja</text>
<text x="540" y="310" text-anchor="middle" class="p">(visto de costado)</text>
</svg>
