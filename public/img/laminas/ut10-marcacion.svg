<g id="faro"><path d="M-7,0 L-4,-26 L4,-26 L7,0 Z" fill="#fff" stroke="#14202b" stroke-width="2"/><rect x="-5" y="-34" width="10" height="8" fill="#facc15" stroke="#14202b" stroke-width="1.5"/><path d="M-4,-17 L4,-17" stroke="#dc2626" stroke-width="4"/></g></defs>
<rect width="720" height="380" rx="14" fill="#fff"/>
<line x1="230" y1="270" x2="230" y2="50" stroke="#14202b" stroke-width="2.5" /><text x="230" y="40" text-anchor="middle" class="l">N</text><line x1="230" y1="270" x2="358.6" y2="116.8" stroke="#5c6b78" stroke-width="3" stroke-dasharray="10 6"/><line x1="230" y1="270" x2="417.9" y2="338.4" stroke="#c2410c" stroke-width="2.5" /><g transform="translate(432 343.5)"><use href="#faro"/></g><g transform="translate(230 270) rotate(40) scale(1.2)"><use href="#bq" class="h"/></g><path d="M230,200 A70,70 0 0 1 275,216.4" fill="none" stroke="#14202b" stroke-width="2" /><path d="M300.7,185.7 A110,110 0 0 1 333.4,307.6" fill="none" stroke="#1d5f93" stroke-width="3" /><path d="M230,120 A150,150 0 0 1 371,321.3" fill="none" stroke="#c2410c" stroke-width="3" /><text x="248.8" y="218.3" text-anchor="middle" class="l">R</text><text x="355.2" y="243.4" text-anchor="middle" class="l">M</text><text x="367.6" y="177.2" class="l" style="fill:#c2410c">D</text><text x="450" y="60" text-anchor="start" class="p"><tspan class="l">Rumbo (R)</tspan>: del norte a la proa.</text><text x="450" y="79" text-anchor="start" class="p"><tspan class="l" style="fill:#1d5f93">Marcación (M)</tspan>: de la proa a la visual.</text><text x="450" y="98" text-anchor="start" class="p"><tspan class="l" style="fill:#c2410c">Demora (D)</tspan>: del norte a la visual.</text><text x="450" y="150" text-anchor="start" class="p"><tspan class="b">D = R + M</tspan></text><text x="450" y="184" text-anchor="start" class="p">Ej.: R 040° y M 70° por Er</text><text x="450" y="203" text-anchor="start" class="p">→ D = 110°.</text><text x="450" y="222" text-anchor="start" class="p">Con M 70° por Br (−70°):</text><text x="450" y="241" text-anchor="start" class="p">D = 040° − 70° = 330°.</text><text x="450" y="280" text-anchor="start" class="p">Marcación circular: 0°–360°</text><text x="450" y="299" text-anchor="start" class="p">desde la proa hacia Er.</text><text x="450" y="318" text-anchor="start" class="p">Semicircular: 0°–180°,</text><text x="450" y="337" text-anchor="start" class="p">Er (+) o Br (−).</text>
</svg>
