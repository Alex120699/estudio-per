<path id="bq" d="M0,-30 C9,-21 11,-9 11,0 L9,24 L-9,24 L-11,0 C-11,-9 -9,-21 0,-30 Z"/></defs>
<rect width="750" height="545" rx="14" fill="#fff"/>
<rect x="10" y="10" width="177" height="225" rx="10" fill="#e8f3fb"/><line x1="98" y1="22" x2="98" y2="170" stroke="#8a97a3" stroke-width="2"/><circle cx="98" cy="95" r="14" fill="#1f2328"/><text x="98" y="200" text-anchor="middle" class="l">Fondeado</text><text x="98" y="220" text-anchor="middle" class="p" style="font-size:14px">una bola</text><rect x="195" y="10" width="177" height="225" rx="10" fill="#e8f3fb"/><line x1="283" y1="22" x2="283" y2="170" stroke="#8a97a3" stroke-width="2"/><circle cx="283" cy="77" r="14" fill="#1f2328"/><circle cx="283" cy="113" r="14" fill="#1f2328"/><text x="283" y="200" text-anchor="middle" class="l">Sin gobierno</text><text x="283" y="220" text-anchor="middle" class="p" style="font-size:14px">dos bolas</text><rect x="380" y="10" width="177" height="225" rx="10" fill="#e8f3fb"/><line x1="468" y1="22" x2="468" y2="170" stroke="#8a97a3" stroke-width="2"/><circle cx="468" cy="59" r="14" fill="#1f2328"/><circle cx="468" cy="95" r="14" fill="#1f2328"/><circle cx="468" cy="131" r="14" fill="#1f2328"/><text x="468" y="200" text-anchor="middle" class="l">Varado</text><text x="468" y="220" text-anchor="middle" class="p" style="font-size:14px">tres bolas</text><rect x="565" y="10" width="177" height="225" rx="10" fill="#e8f3fb"/><line x1="653" y1="22" x2="653" y2="170" stroke="#8a97a3" stroke-width="2"/><circle cx="653" cy="51" r="14" fill="#1f2328"/><path d="M653,73 L669,95 L653,117 L637,95 Z" fill="#1f2328"/><circle cx="653" cy="139" r="14" fill="#1f2328"/><text x="653" y="200" text-anchor="middle" class="l">Maniobra restringida</text><text x="653" y="220" text-anchor="middle" class="p" style="font-size:14px">bola, bicónica, bola</text><rect x="10" y="245" width="177" height="225" rx="10" fill="#e8f3fb"/><line x1="98" y1="257" x2="98" y2="405" stroke="#8a97a3" stroke-width="2"/><rect x="86" y="312" width="24" height="36" fill="#1f2328"/><text x="98" y="435" text-anchor="middle" class="l">Restringido por calado</text><text x="98" y="455" text-anchor="middle" class="p" style="font-size:14px">cilindro</text><rect x="195" y="245" width="177" height="225" rx="10" fill="#e8f3fb"/><line x1="283" y1="257" x2="283" y2="405" stroke="#8a97a3" stroke-width="2"/><path d="M267,308 L299,308 L283,330 Z M267,352 L299,352 L283,330 Z" fill="#1f2328"/><text x="283" y="435" text-anchor="middle" class="l">Pesca</text><text x="283" y="455" text-anchor="middle" class="p" style="font-size:14px">conos unidos por los vértices</text><rect x="380" y="245" width="177" height="225" rx="10" fill="#e8f3fb"/><line x1="468" y1="257" x2="468" y2="405" stroke="#8a97a3" stroke-width="2"/><path d="M452,317 L484,317 L468,343 Z" fill="#1f2328"/><text x="468" y="435" text-anchor="middle" class="l">Vela y motor a la vez</text><text x="468" y="455" text-anchor="middle" class="p" style="font-size:14px">cono con el vértice abajo</text><rect x="565" y="245" width="177" height="225" rx="10" fill="#e8f3fb"/><line x1="653" y1="257" x2="653" y2="405" stroke="#8a97a3" stroke-width="2"/><path d="M653,308 L669,330 L653,352 L637,330 Z" fill="#1f2328"/><text x="653" y="435" text-anchor="middle" class="l">Remolque &gt; 200 m</text><text x="653" y="455" text-anchor="middle" class="p" style="font-size:14px">bicónica</text><text x="375" y="506" text-anchor="middle" class="p">Marcas negras, a la vista de día. Pesca con artes de más de 150 m: además, un cono</text><text x="375" y="525" text-anchor="middle" class="p">con el vértice hacia arriba en la dirección del arte. Buceo: réplica rígida de la bandera «A».</text>
</svg>
