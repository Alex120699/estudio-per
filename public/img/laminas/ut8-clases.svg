<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 360" role="img" aria-labelledby="t">
<title id="t">Clases de fuego A, B, C y F y con qué se apagan</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#14202b}
.b{font-weight:700}.p{font-size:15px;fill:#4b5b69}.l{font-size:15px;font-weight:600;fill:#14202b}
.h{fill:#eef2f5;stroke:#14202b;stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.k{fill:none;stroke:#14202b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs><marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker>
<marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1d5f93"/></marker>
<marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5c6b78"/></marker>
<path id="bq" d="M0,-30 C9,-21 11,-9 11,0 L9,24 L-9,24 L-11,0 C-11,-9 -9,-21 0,-30 Z"/>
<path id="llama" d="M0,0 C-22,0 -26,-22 -14,-38 C-12,-26 -6,-24 -4,-30 C-8,-44 2,-58 10,-64 C8,-48 22,-40 20,-22 C26,-28 26,-34 24,-38 C34,-24 30,0 0,0 Z"/></defs>
<rect width="750" height="360" rx="14" fill="#fff"/>
<rect x="10" y="10" width="177" height="280" rx="10" fill="#f4f7fa"/><rect x="68" y="24" width="60" height="60" rx="10" fill="#15803d"/><text x="98" y="68" text-anchor="middle" style="font-size:38px;font-weight:800;fill:#fff">A</text><text x="98" y="112" text-anchor="middle" class="l">Sólidos</text><text x="98" y="134" text-anchor="middle" class="p">madera, tela, papel</text><text x="98" y="153" text-anchor="middle" class="p">(dejan brasa)</text><text x="98" y="196" text-anchor="middle" class="p">Se apaga con:</text><text x="98" y="215" text-anchor="middle" class="l">agua, espuma, polvo</text><rect x="38" y="240" width="120" height="30" rx="15" fill="#dcfce7"/><text x="98" y="261" text-anchor="middle" class="l">agua: sí</text><rect x="195" y="10" width="177" height="280" rx="10" fill="#f4f7fa"/><rect x="253" y="24" width="60" height="60" rx="10" fill="#c2410c"/><text x="283" y="68" text-anchor="middle" style="font-size:38px;font-weight:800;fill:#fff">B</text><text x="283" y="112" text-anchor="middle" class="l">Líquidos</text><text x="283" y="134" text-anchor="middle" class="p">gasolina, gasóleo,</text><text x="283" y="153" text-anchor="middle" class="p">aceites, plásticos</text><text x="283" y="196" text-anchor="middle" class="p">Se apaga con:</text><text x="283" y="215" text-anchor="middle" class="l">polvo, CO₂, espuma</text><rect x="223" y="240" width="120" height="30" rx="15" fill="#fde2e2"/><text x="283" y="261" text-anchor="middle" class="l">agua: no</text><rect x="380" y="10" width="177" height="280" rx="10" fill="#f4f7fa"/><rect x="438" y="24" width="60" height="60" rx="10" fill="#1d5f93"/><text x="468" y="68" text-anchor="middle" style="font-size:38px;font-weight:800;fill:#fff">C</text><text x="468" y="112" text-anchor="middle" class="l">Gases</text><text x="468" y="134" text-anchor="middle" class="p">butano, propano</text><text x="468" y="196" text-anchor="middle" class="p">Se apaga con:</text><text x="468" y="215" text-anchor="middle" class="l">polvo; cerrar el gas</text><rect x="408" y="240" width="120" height="30" rx="15" fill="#fde2e2"/><text x="468" y="261" text-anchor="middle" class="l">agua: no</text><rect x="565" y="10" width="177" height="280" rx="10" fill="#f4f7fa"/><rect x="623" y="24" width="60" height="60" rx="10" fill="#7c3aed"/><text x="653" y="68" text-anchor="middle" style="font-size:38px;font-weight:800;fill:#fff">F</text><text x="653" y="112" text-anchor="middle" class="l">Aceite de cocina</text><text x="653" y="134" text-anchor="middle" class="p">freidora, sartén</text><text x="653" y="196" text-anchor="middle" class="p">Se apaga con:</text><text x="653" y="215" text-anchor="middle" class="l">tapar; extintor F</text><rect x="593" y="240" width="120" height="30" rx="15" fill="#fde2e2"/><text x="653" y="261" text-anchor="middle" class="l">agua: no</text><text x="375" y="318" text-anchor="middle" class="p">Se clasifican según el combustible. Fuego eléctrico: nunca agua; cortar la corriente</text><text x="375" y="337" text-anchor="middle" class="p">y usar CO₂ o polvo. En la sartén, el agua provoca una explosión de vapor.</text>
</svg>
