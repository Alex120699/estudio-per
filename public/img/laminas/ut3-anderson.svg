<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t">
<title id="t">Hombre al agua: librar la hélice y maniobra de Anderson</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#14202b}
.b{font-weight:700}.p{font-size:16px;fill:#4b5b69}
.h{fill:#eef2f5;stroke:#14202b;stroke-width:2.5;stroke-linejoin:round}
.tr{fill:none;stroke:#c2410c;stroke-width:3;stroke-dasharray:8 5}
.fl{fill:none;stroke:#c2410c;stroke-width:3}
</style>
<defs>
<marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker>
<path id="b" d="M0,-40 C10,-30 14,-16 14,0 L12,34 L-12,34 L-14,0 C-14,-16 -10,-30 0,-40 Z"/>
<g id="hom"><circle r="11" fill="#e85d04" stroke="#14202b" stroke-width="2"/><circle r="4" fill="#14202b"/></g>
</defs>
<rect width="720" height="400" rx="14" fill="#fff"/>
<rect x="10" y="10" width="290" height="380" rx="10" fill="#e8f3fb"/>
<text x="155" y="40" text-anchor="middle" class="b">Librar la hélice</text>
<g transform="translate(140 200) rotate(14)">
<use href="#b" class="h" transform="scale(2.2)"/>
<line x1="0" y1="75" x2="14" y2="98" stroke="#14202b" stroke-width="6" stroke-linecap="round"/>
</g>
<use href="#hom" x="230" y="270"/>
<text x="236" y="302" text-anchor="middle" class="p">cae por</text><text x="236" y="320" text-anchor="middle" class="p">estribor</text>
<path class="fl" d="M108,300 Q80,300 70,280" marker-end="url(#f)"/>
<text x="60" y="330" class="p">la popa se</text><text x="60" y="348" class="p">aparta de él</text>
<text x="155" y="374" text-anchor="middle" class="p">timón a la banda de la caída</text>
<text x="510" y="40" text-anchor="middle" class="b">Maniobra de Anderson</text>
<use href="#hom" x="462" y="300"/>
<text x="500" y="296" class="p">caída</text>
<path class="tr" d="M440,330 L440,250 C440,140 560,110 610,170 C660,230 620,320 540,330 C510,334 490,320 478,310" marker-end="url(#f)"/>
<use href="#b" class="h" transform="translate(440 345)"/>
<text x="600" y="110" class="p">todo el timón</text>
<text x="600" y="128" class="p">a la banda de</text>
<text x="600" y="146" class="p">la caída</text>
<text x="510" y="394" text-anchor="middle" class="p">giro de unos 250° y aproximación</text>
</svg>
