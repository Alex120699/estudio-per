<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t">
<title id="t">Señales de buceo: bandera Alfa del Código Internacional y bandera Bravo modificada; resguardo mínimo de 50 metros</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#14202b}
.b{font-weight:700}.p{font-size:16px;fill:#4b5b69}
</style>
<defs><clipPath id="bravo"><rect x="440" y="60" width="150" height="100"/></clipPath><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker></defs>
<rect width="720" height="360" rx="14" fill="#fff"/>
<line x1="90" y1="50" x2="90" y2="200" stroke="#5c6b78" stroke-width="5"/>
<path d="M92,60 L167,60 L167,160 L92,160 Z" fill="#fff" stroke="#14202b" stroke-width="2"/>
<path d="M167,60 L242,60 L206,110 L242,160 L167,160 Z" fill="#1d4ed8" stroke="#14202b" stroke-width="2"/>
<text x="165" y="230" text-anchor="middle" class="b">Bandera «A» (Alfa)</text>
<text x="165" y="252" text-anchor="middle" class="p">blanca y azul, en cola de golondrina</text>
<text x="165" y="274" text-anchor="middle" class="p">la lleva la embarcación de apoyo:</text>
<text x="165" y="294" text-anchor="middle" class="p">«tengo un buzo sumergido»</text>
<line x1="438" y1="50" x2="438" y2="200" stroke="#5c6b78" stroke-width="5"/>
<rect x="440" y="60" width="150" height="100" fill="#dc2626" stroke="#14202b" stroke-width="2"/>
<path d="M440,60 L590,160" stroke="#fff" stroke-width="24" clip-path="url(#bravo)"/>
<rect x="440" y="60" width="150" height="100" fill="none" stroke="#14202b" stroke-width="2"/>
<text x="515" y="230" text-anchor="middle" class="b">«B» (Bravo) modificada</text>
<text x="515" y="252" text-anchor="middle" class="p">roja con franja diagonal blanca,</text>
<text x="515" y="274" text-anchor="middle" class="p">normalmente sobre una boya:</text>
<text x="515" y="294" text-anchor="middle" class="p">posición del buceador</text>
<text x="360" y="336" text-anchor="middle" class="b" style="fill:#9a3412">Resguardo: al menos 50 m y a poca velocidad</text>
<text x="360" y="354" text-anchor="middle" class="p" style="font-size:13px">(antes eran 25 m; algún examen antiguo lo pregunta así)</text>
</svg>
