<text x="470" y="270" text-anchor="middle" class="b">Dextrógira</text>
<text x="470" y="292" text-anchor="middle" class="p">horaria</text>
<text x="640" y="270" text-anchor="middle" class="b">Levógira</text>
<text x="640" y="292" text-anchor="middle" class="p">antihoraria</text>
<text x="360" y="386" text-anchor="middle" class="p">Gemelas de giro al exterior: estribor dextrógira y babor levógira.</text>
