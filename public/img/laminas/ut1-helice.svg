<path d="M18,-11 Q48,0 18,11 Z" fill="#6b7a87" stroke="#14202b" stroke-width="2"/>
</g>
<line class="ln" x1="80" y1="150" x2="60" y2="210"/><text x="30" y="232">Eje</text>
<line class="ln" x1="166" y1="172" x2="140" y2="240"/><text x="100" y="262">Bocina</text>
<line class="ln" x1="252" y1="200" x2="200" y2="320"/><text x="150" y="342">Núcleo</text>
<line class="ln" x1="272" y1="130" x2="310" y2="80"/><text x="306" y="72" text-anchor="middle">Pala</text>
<line class="ln" x1="290" y1="214" x2="320" y2="260"/><text x="300" y="282">Capacete</text>
<g transform="translate(470 150)">
<circle r="16" fill="#a8861f" stroke="#14202b" stroke-width="2"/>
<path d="M-6,-14 C-20,-50 10,-70 14,-56 C16,-40 10,-24 6,-14 Z" class="pala"/>
<path d="M-6,-14 C-20,-50 10,-70 14,-56 C16,-40 10,-24 6,-14 Z" class="pala" transform="rotate(120)"/>
<path d="M-6,-14 C-20,-50 10,-70 14,-56 C16,-40 10,-24 6,-14 Z" class="pala" transform="rotate(240)"/>
<path d="M0,-78 A78,78 0 0 1 74,-24" fill="none" stroke="#c2410c" stroke-width="4" marker-end="url(#f)"/>
