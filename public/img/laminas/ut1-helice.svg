<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t">
<title id="t">Partes de la hélice (eje, bocina, núcleo, palas y capacete) y sentido de giro dextrógiro y levógiro visto desde popa</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#14202b}
.b{font-weight:700}.p{font-size:16px;fill:#4b5b69}
.ln{stroke:#14202b;stroke-width:1.5;fill:none}
.pala{fill:#c9a227;stroke:#14202b;stroke-width:2;stroke-linejoin:round}
</style>
<defs><marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker></defs>
<rect width="720" height="400" rx="14" fill="#fff"/>
<rect x="0" y="0" width="360" height="360" fill="#d7ebf8" rx="14"/>
<path d="M0,60 L200,60 L150,150 L0,150 Z" fill="#eef2f5" stroke="#14202b" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="20" y1="132" x2="250" y2="200" stroke="#4b5b69" stroke-width="8"/>
<path d="M150,150 L180,160 L176,176 L140,164 Z" fill="#cdd6dd" stroke="#14202b" stroke-width="1.5"/>
