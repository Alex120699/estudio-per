<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t">
<title id="t">Líneas de posición: enfilación, oposición y distancia</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#14202b}
.b{font-weight:700}.p{font-size:15px;fill:#4b5b69}.l{font-size:15px;font-weight:600;fill:#14202b}.s{font-size:14px;fill:#4b5b69}
.h{fill:#eef2f5;stroke:#14202b;stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
</style>
<defs><marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker>
<marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1d5f93"/></marker>
<marker id="fv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#15803d"/></marker>
<marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5c6b78"/></marker>
<marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#14202b"/></marker>
<path id="bq" d="M0,-30 C9,-21 11,-9 11,0 L9,24 L-9,24 L-11,0 C-11,-9 -9,-21 0,-30 Z"/>
<g id="faro"><path d="M-7,0 L-4,-26 L4,-26 L7,0 Z" fill="#fff" stroke="#14202b" stroke-width="2"/><rect x="-5" y="-34" width="10" height="8" fill="#facc15" stroke="#14202b" stroke-width="1.5"/><path d="M-4,-17 L4,-17" stroke="#dc2626" stroke-width="4"/></g></defs>
<rect width="720" height="440" rx="14" fill="#fff"/>
<g stroke="#e3e8ec" stroke-width="2"><line x1="240" y1="16" x2="240" y2="300"/><line x1="480" y1="16" x2="480" y2="300"/></g><text x="120" y="36" text-anchor="middle" class="b">Enfilación</text><line x1="120" y1="60" x2="120" y2="290" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><g transform="translate(120 100) scale(1)"><use href="#faro"/></g><rect x="111" y="140" width="18" height="26" fill="#9aa5b1" stroke="#14202b" stroke-width="2"/><g transform="translate(120 250) rotate(0) scale(1)"><use href="#bq" class="h"/></g><text x="150" y="100" text-anchor="start" class="s">faro</text><text x="140" y="160" text-anchor="start" class="s">torre</text><text x="120" y="320" text-anchor="middle" class="p">los dos puntos en línea,</text><text x="120" y="339" text-anchor="middle" class="p">uno tras otro, por el mismo</text><text x="120" y="358" text-anchor="middle" class="p">lado: la más exacta</text><text x="360" y="36" text-anchor="middle" class="b">Oposición</text><line x1="360" y1="60" x2="360" y2="290" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><g transform="translate(360 100) scale(1)"><use href="#faro"/></g><rect x="351" y="250" width="18" height="26" fill="#9aa5b1" stroke="#14202b" stroke-width="2"/><g transform="translate(360 180) rotate(90) scale(1)"><use href="#bq" class="h"/></g><text x="360" y="320" text-anchor="middle" class="p">estamos en la línea</text><text x="360" y="339" text-anchor="middle" class="p">entre los dos puntos,</text><text x="360" y="358" text-anchor="middle" class="p">uno a cada lado</text><text x="600" y="36" text-anchor="middle" class="b">Distancia</text><circle cx="600" cy="170" r="80" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><g transform="translate(600 182) scale(1)"><use href="#faro"/></g><g transform="translate(657 113) rotate(45) scale(0.9)"><use href="#bq" class="h"/></g><line x1="600" y1="170" x2="543" y2="227" stroke="#5c6b78" stroke-width="1.5"/><text x="560" y="214" text-anchor="end" class="s">d</text><text x="600" y="320" text-anchor="middle" class="p">círculo con centro</text><text x="600" y="339" text-anchor="middle" class="p">en el punto</text><text x="360" y="400" text-anchor="middle" class="p">Con dos líneas simultáneas que se corten (mejor cerca de 90°) tenemos la situación.</text><text x="360" y="419" text-anchor="middle" class="p">Una demora se toma con la aguja y se pasa a verdadera: Dv = Da + Ct.</text>
</svg>
