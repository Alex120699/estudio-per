<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" role="img" aria-labelledby="t">
<title id="t">Abatimiento por el viento y deriva por la corriente</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#14202b}
.b{font-weight:700}.p{font-size:15px;fill:#4b5b69}.l{font-size:15px;font-weight:600;fill:#14202b}.s{font-size:14px;fill:#4b5b69}
.h{fill:#eef2f5;stroke:#14202b;stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
</style>
<defs><marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker>
<marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1d5f93"/></marker>
<marker id="fv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#15803d"/></marker>
<marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5c6b78"/></marker>
<marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#14202b"/></marker>
<path id="bq" d="M0,-30 C9,-21 11,-9 11,0 L9,24 L-9,24 L-11,0 C-11,-9 -9,-21 0,-30 Z"/>
<g id="faro"><path d="M-7,0 L-4,-26 L4,-26 L7,0 Z" fill="#fff" stroke="#14202b" stroke-width="2"/><rect x="-5" y="-34" width="10" height="8" fill="#facc15" stroke="#14202b" stroke-width="1.5"/><path d="M-4,-17 L4,-17" stroke="#dc2626" stroke-width="4"/></g></defs>
<rect width="720" height="396" rx="14" fill="#fff"/>
<line x1="360" y1="16" x2="360" y2="300" stroke="#e3e8ec" stroke-width="2"/><text x="180" y="36" text-anchor="middle" class="b">Abatimiento (viento)</text><path d="M20,100 L70,100" fill="none" stroke="#1d5f93" stroke-width="3" marker-end="url(#fa)" /><path d="M20,150 L70,150" fill="none" stroke="#1d5f93" stroke-width="3" marker-end="url(#fa)" /><path d="M20,200 L70,200" fill="none" stroke="#1d5f93" stroke-width="3" marker-end="url(#fa)" /><text x="45" y="86" text-anchor="middle" class="s">viento</text><g transform="translate(160 250) rotate(0) scale(1.3)"><use href="#bq" class="h"/></g><line x1="160" y1="210" x2="160" y2="70" stroke="#5c6b78" stroke-width="2" stroke-dasharray="6 5"/><path d="M160,215 L225,75" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#f)" /><path d="M160,130 A120,120 0 0 1 210.7,141.2" fill="none" stroke="#14202b" stroke-width="2" /><text x="165" y="60" text-anchor="end" class="s">proa</text><text x="232" y="72" text-anchor="start" class="s">trayectoria</text><text x="180" y="320" text-anchor="middle" class="p">empuja la obra muerta:</text><text x="180" y="339" text-anchor="middle" class="p">más en barcos altos</text><text x="540" y="36" text-anchor="middle" class="b">Deriva (corriente)</text><rect x="380" y="60" width="320" height="220" fill="#d7ebf8" rx="8"/><path d="M390,110 L440,110" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#fv)" /><path d="M390,170 L440,170" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#fv)" /><path d="M390,230 L440,230" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#fv)" /><text x="415" y="96" text-anchor="middle" class="s">corriente</text><g transform="translate(520 250) rotate(0) scale(1.3)"><use href="#bq" class="h"/></g><line x1="520" y1="210" x2="520" y2="70" stroke="#5c6b78" stroke-width="2" stroke-dasharray="6 5"/><path d="M520,215 L585,75" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#f)" /><text x="540" y="320" text-anchor="middle" class="p">arrastra la obra viva</text><text x="540" y="339" text-anchor="middle" class="p">con la masa de agua</text><text x="360" y="370" text-anchor="middle" class="p">El barco no va exactamente hacia donde apunta la proa: hay que corregir el rumbo.</text>
</svg>
