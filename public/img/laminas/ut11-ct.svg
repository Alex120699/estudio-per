scale(0.9)"><use href="#bq" class="h"/></g><text x="470" y="50" text-anchor="start" class="b">Corrección total</text><text x="470" y="80" text-anchor="start" class="p">con enfilación u oposición</text><text x="470" y="120" text-anchor="start" class="p">1 En la carta, medir la demora</text><text x="470" y="142" text-anchor="start" class="p">   verdadera de la línea: Dv.</text><text x="470" y="164" text-anchor="start" class="p">2 Con la aguja, tomar la demora</text><text x="470" y="186" text-anchor="start" class="p">   de aguja del faro: Da.</text><text x="470" y="208" text-anchor="start" class="p">3 Ct = Dv − Da</text><text x="470" y="250" text-anchor="start" class="l">Ej.: 326° − 332° = −6°</text><text x="470" y="290" text-anchor="start" class="p">También: Ct = dm + Δ.</text><text x="470" y="309" text-anchor="start" class="p">Ángulos exagerados.</text>
