<defs><marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker>
<marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5c6b78"/></marker>
<path id="bq" d="M0,-30 C9,-21 11,-9 11,0 L9,24 L-9,24 L-11,0 C-11,-9 -9,-21 0,-30 Z"/></defs>
<rect width="750" height="630" rx="14" fill="#fff"/>
<g transform="translate(10 10)"><rect width="177" height="177" rx="10" fill="#0f1f33"/><line x1="8" y1="128" x2="169" y2="128" stroke="#1e3a5f" stroke-width="2"/><circle cx="88" cy="40" r="15" fill="#fffbe6" opacity=".25"/><circle cx="88" cy="40" r="8" fill="#fffbe6"/><circle cx="58" cy="95" r="15" fill="#22c55e" opacity=".25"/><circle cx="58" cy="95" r="8" fill="#22c55e"/><circle cx="118" cy="95" r="15" fill="#ef4444" opacity=".25"/><circle cx="118" cy="95" r="8" fill="#ef4444"/><text x="88" y="150" text-anchor="middle" class="nb">Motor &lt; 50 m</text><text x="88" y="168" text-anchor="middle" class="n">de proa</text></g><g transform="translate(195 10)"><rect width="177" height="177" rx="10" fill="#0f1f33"/><line x1="8" y1="128" x2="169" y2="128" stroke="#1e3a5f" stroke-width="2"/><circle cx="78" cy="55" r="15" fill="#fffbe6" opacity=".25"/><circle cx="78" cy="55" r="8" fill="#fffbe6"/><circle cx="98" cy="30" r="15" fill="#fffbe6" opacity=".25"/><circle cx="98" cy="30" r="8" fill="#fffbe6"/><circle cx="58" cy="100" r="15" fill="#22c55e" opacity=".25"/><circle cx="58" cy="100" r="8" fill="#22c55e"/><circle cx="118" cy="100" r="15" fill="#ef4444" opacity=".25"/><circle cx="118" cy="100" r="8" fill="#ef4444"/><text x="88" y="150" text-anchor="middle" class="nb">Motor ≥ 50 m</text><text x="88" y="168" text-anchor="middle" class="n">de proa</text></g><g transform="translate(380 10)"><rect width="177" height="177" rx="10" fill="#0f1f33"/><line x1="8" y1="128" x2="169" y2="128" stroke="#1e3a5f" stroke-width="2"/><circle cx="58" cy="80" r="15" fill="#22c55e" opacity=".25"/><circle cx="58" cy="80" r="8" fill="#22c55e"/><circle cx="118" cy="80" r="15" fill="#ef4444" opacity=".25"/><circle cx="118" cy="80" r="8" fill="#ef4444"/><text x="88" y="150" text-anchor="middle" class="nb">Velero</text><text x="88" y="168" text-anchor="middle" class="n">de proa: sin tope</text></g><g transform="translate(565 10)"><rect width="177" height="177" rx="10" fill="#0f1f33"/><line x1="8" y1="128" x2="169" y2="128" stroke="#1e3a5f" stroke-width="2"/><circle cx="88" cy="75" r="15" fill="#fffbe6" opacity=".25"/><circle cx="88" cy="75" r="8" fill="#fffbe6"/><text x="88" y="150" text-anchor="middle" class="nb">Cualquiera</text><text x="88" y="168" text-anchor="middle" class="n">por la popa: alcance</text></g><g transform="translate(10 195)"><rect width="177" height="177" rx="10" fill="#0f1f33"/><line x1="8" y1="128" x2="169" y2="128" stroke="#1e3a5f" stroke-width="2"/><circle cx="88" cy="45" r="15" fill="#22c55e" opacity=".25"/><circle cx="88" cy="45" r="8" fill="#22c55e"/><circle cx="88" cy="90" r="15" fill="#fffbe6" opacity=".25"/><circle cx="88" cy="90" r="8" fill="#fffbe6"/><text x="88" y="150" text-anchor="middle" class="nb">Pesca de arrastre</text><text x="88" y="168" text-anchor="middle" class="n">verde sobre blanca</text></g><g transform="translate(195 195)"><rect width="177" height="177" rx="10" fill="#0f1f33"/><line x1="8" y1="128" x2="169" y2="128" stroke="#1e3a5f" stroke-width="2"/><circle cx="88" cy="45" r="15" fill="#ef4444" opacity=".25"/><circle cx="88" cy="45" r="8" fill="#ef4444"/><circle cx="88" cy="90" r="15" fill="#fffbe6" opacity=".25"/><circle cx="88" cy="90" r="8" fill="#fffbe6"/><text x="88" y="150" text-anchor="middle" class="nb">Otra pesca</text><text x="88" y="168" text-anchor="middle" class="n">roja sobre blanca</text></g><g transform="translate(380 195)"><rect width="177" height="177" rx="10" fill="#0f1f33"/><line x1="8" y1="128" x2="169" y2="128" stroke="#1e3a5f" stroke-width="2"/><circle cx="88" cy="45" r="15" fill="#ef4444" opacity=".25"/><circle cx="88" cy="45" r="8" fill="#ef4444"/><circle cx="88" cy="90" r="15" fill="#ef4444" opacity=".25"/><circle cx="88" cy="90" r="8" fill="#ef4444"/><text x="88" y="150" text-anchor="middle" class="nb">Sin gobierno</text><text x="88" y="168" text-anchor="middle" class="n">dos rojas</text></g><g transform="translate(565 195)"><rect width="177" height="177" rx="10" fill="#0f1f33"/><line x1="8" y1="128" x2="169" y2="128" stroke="#1e3a5f" stroke-width="2"/><circle cx="88" cy="30" r="15" fill="#ef4444" opacity=".25"/><circle cx="88" cy="30" r="8" fill="#ef4444"/><circle cx="88" cy="70" r="15" fill="#fffbe6" opacity=".25"/><circle cx="88" cy="70" r="8" fill="#fffbe6"/><circle cx="88" cy="110" r="15" fill="#ef4444" opacity=".25"/><circle cx="88" cy="110" r="8" fill="#ef4444"/><text x="88" y="150" text-anchor="middle" class="nb" style="font-size:14px">Maniobra restringida</text><text x="88" y="168" text-anchor="middle" class="n">roja, blanca, roja</text></g><g transform="translate(10 380)"><rect width="177" height="177" rx="10" fill="#0f1f33"/><line x1="8" y1="128" x2="169" y2="128" stroke="#1e3a5f" stroke-width="2"/><circle cx="88" cy="30" r="15" fill="#ef4444" opacity=".25"/><circle cx="88" cy="30" r="8" fill="#ef4444"/><circle cx="88" cy="70" r="15" fill="#ef4444" opacity=".25"/><circle cx="88" cy="70" r="8" fill="#ef4444"/><circle cx="88" cy="110" r="15" fill="#ef4444" opacity=".25"/><circle cx="88" cy="110" r="8" fill="#ef4444"/><text x="88" y="150" text-anchor="middle" class="nb" style="font-size:14px">Restringido por calado</text><text x="88" y="168" text-anchor="middle" class="n">tres rojas</text></g><g transform="translate(195 380)"><rect width="177" height="177" rx="10" fill="#0f1f33"/><line x1="8" y1="128" x2="169" y2="128" stroke="#1e3a5f" stroke-width="2"/><circle cx="88" cy="45" r="15" fill="#fffbe6" opacity=".25"/><circle cx="88" cy="45" r="8" fill="#fffbe6"/><circle cx="88" cy="90" r="15" fill="#ef4444" opacity=".25"/><circle cx="88" cy="90" r="8" fill="#ef4444"/><text x="88" y="150" text-anchor="middle" class="nb">Práctico</text><text x="88" y="168" text-anchor="middle" class="n">blanca sobre roja</text></g><g transform="translate(380 380)"><rect width="177" height="177" rx="10" fill="#0f1f33"/><line x1="8" y1="128" x2="169" y2="128" stroke="#1e3a5f" stroke-width="2"/><circle cx="63" cy="50" r="15" fill="#fffbe6" opacity=".25"/><circle cx="63" cy="50" r="8" fill="#fffbe6"/><circle cx="118" cy="95" r="15" fill="#fffbe6" opacity=".25"/><circle cx="118" cy="95" r="8" fill="#fffbe6"/><text x="88" y="150" text-anchor="middle" class="nb">Fondeado</text><text x="88" y="168" text-anchor="middle" class="n" style="font-size:13px">≥ 50 m: otra a popa, más baja</text></g><g transform="translate(565 380)"><rect width="177" height="177" rx="10" fill="#0f1f33"/><line x1="8" y1="128" x2="169" y2="128" stroke="#1e3a5f" stroke-width="2"/><circle cx="53" cy="50" r="15" fill="#fffbe6" opacity=".25"/><circle cx="53" cy="50" r="8" fill="#fffbe6"/><circle cx="123" cy="85" r="15" fill="#fffbe6" opacity=".25"/><circle cx="123" cy="85" r="8" fill="#fffbe6"/><circle cx="88" cy="40" r="15" fill="#ef4444" opacity=".25"/><circle cx="88" cy="40" r="8" fill="#ef4444"/><circle cx="88" cy="80" r="15" fill="#ef4444" opacity=".25"/><circle cx="88" cy="80" r="8" fill="#ef4444"/><text x="88" y="150" text-anchor="middle" class="nb">Varado</text><text x="88" y="168" text-anchor="middle" class="n">fondeo + dos rojas</text></g><text x="375" y="586" text-anchor="middle" class="p">Luces todo horizonte en vertical; con arrancada se añaden las de costado y alcance (y tope si toca).</text><text x="375" y="605" text-anchor="middle" class="p">Remolcador: dos de tope en vertical (tres si el remolque mide más de 200 m) y amarilla sobre la de alcance.</text>
</svg>
