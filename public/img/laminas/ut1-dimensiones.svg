<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t">
<title id="t">Dimensiones: eslora, manga, puntal, francobordo, calados de proa y de popa</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#14202b}
.b{font-weight:700}.p{font-size:16px;fill:#4b5b69}
.c{stroke:#c2410c;stroke-width:2;fill:none}
.g{stroke:#8795a1;stroke-width:1;stroke-dasharray:4 4;fill:none}
</style>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker></defs>
<rect width="760" height="400" rx="14" fill="#fff"/>
<rect x="0" y="200" width="760" height="200" fill="#d7ebf8"/>
<line x1="0" y1="200" x2="760" y2="200" stroke="#2b7bbd" stroke-width="2" stroke-dasharray="8 5"/>
<path d="M60,130 L520,120 C512,170 496,230 456,262 L120,272 C90,268 72,240 68,200 Z" fill="#eef2f5" stroke="#14202b" stroke-width="2.5" stroke-linejoin="round"/>
<line class="g" x1="60" y1="130" x2="60" y2="70"/><line class="g" x1="520" y1="120" x2="520" y2="70"/>
<line class="c" x1="62" y1="80" x2="518" y2="80" marker-start="url(#f)" marker-end="url(#f)"/>
<text x="290" y="70" text-anchor="middle" class="b">Eslora</text>
