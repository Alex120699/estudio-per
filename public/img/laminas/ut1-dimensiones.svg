<text x="380" y="340" text-anchor="middle" class="p">Calado medio = (calado de proa + calado de popa) ÷ 2</text>
<text x="380" y="364" text-anchor="middle" class="p">Asiento = calado de popa − calado de proa (aquí, apopado)</text>
