<line class="c" x1="490" y1="202" x2="490" y2="260" marker-start="url(#f)" marker-end="url(#f)"/>
<text x="500" y="236">Calado</text><text x="500" y="256">de proa</text>
<line class="g" x1="120" y1="272" x2="80" y2="272"/>
<line class="c" x1="90" y1="202" x2="90" y2="270" marker-start="url(#f)" marker-end="url(#f)"/>
