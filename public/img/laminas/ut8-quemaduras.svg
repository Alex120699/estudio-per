<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" role="img" aria-labelledby="t">
<title id="t">Grados de las quemaduras: enrojecimiento, ampollas y destrucción de la piel</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#14202b}
.b{font-weight:700}.p{font-size:15px;fill:#4b5b69}.l{font-size:15px;font-weight:600;fill:#14202b}
.h{fill:#eef2f5;stroke:#14202b;stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.k{fill:none;stroke:#14202b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs><marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker>
<marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1d5f93"/></marker>
<marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5c6b78"/></marker>
<path id="bq" d="M0,-30 C9,-21 11,-9 11,0 L9,24 L-9,24 L-11,0 C-11,-9 -9,-21 0,-30 Z"/>
<path id="llama" d="M0,0 C-22,0 -26,-22 -14,-38 C-12,-26 -6,-24 -4,-30 C-8,-44 2,-58 10,-64 C8,-48 22,-40 20,-22 C26,-28 26,-34 24,-38 C34,-24 30,0 0,0 Z"/></defs>
<rect width="720" height="384" rx="14" fill="#fff"/>
<rect x="30" y="120" width="200" height="20" fill="#f5d0b5"/><rect x="30" y="140" width="200" height="60" fill="#f9a8b8"/><rect x="30" y="200" width="200" height="50" fill="#fde68a"/><rect x="30" y="120" width="200" height="130" fill="none" stroke="#14202b" stroke-width="1.5"/><rect x="260" y="120" width="200" height="20" fill="#f5d0b5"/><rect x="260" y="140" width="200" height="60" fill="#f9a8b8"/><rect x="260" y="200" width="200" height="50" fill="#fde68a"/><rect x="260" y="120" width="200" height="130" fill="none" stroke="#14202b" stroke-width="1.5"/><rect x="490" y="120" width="200" height="20" fill="#f5d0b5"/><rect x="490" y="140" width="200" height="60" fill="#f9a8b8"/><rect x="490" y="200" width="200" height="50" fill="#fde68a"/><rect x="490" y="120" width="200" height="130" fill="none" stroke="#14202b" stroke-width="1.5"/><rect x="30" y="120" width="200" height="20" fill="#ef4444" opacity=".55"/><text x="40" y="135" text-anchor="start" class="p">epidermis</text><text x="40" y="175" text-anchor="start" class="p">dermis</text><text x="40" y="230" text-anchor="start" class="p">hipodermis</text><rect x="260" y="120" width="200" height="20" fill="#ef4444" opacity=".45"/><path d="M310,122 C310,86 410,86 410,122 Z" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><path d="M520,120 L660,120 L650,160 L630,215 L560,222 L535,170 Z" fill="#3f2a1e" stroke="#14202b" stroke-width="1.5"/><text x="130" y="60" text-anchor="middle" class="b">1.er grado</text><text x="130" y="280" text-anchor="middle" class="l">enrojecimiento</text><text x="130" y="300" text-anchor="middle" class="p">solo la capa superficial</text><text x="360" y="60" text-anchor="middle" class="b">2.º grado</text><text x="360" y="280" text-anchor="middle" class="l">ampollas</text><text x="360" y="300" text-anchor="middle" class="p">llega a la dermis</text><text x="590" y="60" text-anchor="middle" class="b">3.er grado</text><text x="590" y="280" text-anchor="middle" class="l">destrucción de la piel</text><text x="590" y="300" text-anchor="middle" class="p">afecta a todas las capas</text><text x="360" y="344" text-anchor="middle" class="p">Enfriar con agua 10–20 min (no hielo), no reventar las ampollas,</text><text x="360" y="363" text-anchor="middle" class="p">no poner pomadas caseras y cubrir con gasa estéril húmeda.</text>
</svg>
